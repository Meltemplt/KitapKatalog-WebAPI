<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitap Keşif Alanı | Dijital Kütüphane</title>
    <!-- Google Fonts: Playfair Display (Kitap/Editoryal başlıklar) & Plus Jakarta Sans (Gövde metni) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #f8f6f0; /* Sıcak keten/kağıt zemin */
            --surface: #ffffff; /* Saf kağıt beyazı */
            --surface-subtle: #f2eee5; /* Yumuşak bej detaylar */
            --border: #e6dfd3; /* İnce parşömen çizgisi */
            --primary: #8b5e3c; /* Sıcak kahve / deri tonu */
            --primary-dark: #633f25;
            --text-main: #24211d; /* Derin mürekkep rengi */
            --text-muted: #736b5e; /* Dinlendirici vizon gri */
            --accent-gold: #c98a2c; /* Doğal kehribar yıldız rengi */
            --shadow-soft: 0 8px 30px rgba(115, 95, 70, 0.06);
            --shadow-hover: 0 16px 36px rgba(115, 95, 70, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 4rem;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 3.5rem 1.5rem;
        }

        /* Başlık & Hero */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 3.5rem;
        }

        .badge-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(139, 94, 60, 0.08);
            border: 1px solid rgba(139, 94, 60, 0.2);
            color: var(--primary);
            padding: 0.4rem 1.1rem;
            border-radius: 9999px;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.8px;
            margin-bottom: 1.25rem;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(2.4rem, 5vw, 3.4rem);
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.85rem;
            letter-spacing: -0.02em;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            max-width: 580px;
            line-height: 1.7;
            font-weight: 400;
        }

        /* Sayaç Kutucukları */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 1.25rem;
            margin-top: 2.25rem;
            flex-wrap: wrap;
        }

        .stat-item {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 0.85rem 1.75rem;
            border-radius: 16px;
            text-align: center;
            min-width: 130px;
            box-shadow: var(--shadow-soft);
        }

        .stat-value {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-top: 0.15rem;
        }

        /* Arama Kutusu */
        .search-wrapper {
            max-width: 650px;
            margin: 0 auto 3.5rem auto;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            padding: 1.15rem 1.5rem 1.15rem 3.4rem;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 18px;
            color: var(--text-main);
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: all 0.25s ease;
            box-shadow: var(--shadow-soft);
        }

            .search-input::placeholder {
                color: #a39c90;
            }

            .search-input:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 4px rgba(139, 94, 60, 0.12), var(--shadow-soft);
            }

        .search-icon {
            position: absolute;
            left: 1.25rem;
            width: 20px;
            height: 20px;
            color: var(--text-muted);
            pointer-events: none;
        }

        /* Kitap Kartları */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 1.75rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.85rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            box-shadow: var(--shadow-soft);
            cursor: pointer;
        }

            .card:hover {
                transform: translateY(-5px);
                border-color: #d1c6b5;
                box-shadow: var(--shadow-hover);
            }

        .card-header {
            margin-bottom: 1.5rem;
        }

        .book-id-tag {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--primary);
            background: rgba(139, 94, 60, 0.08);
            padding: 0.25rem 0.6rem;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 0.85rem;
            letter-spacing: 0.5px;
        }

        .title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.45rem;
            line-height: 1.35;
        }

        .author {
            color: var(--text-muted);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 1.25rem;
            border-top: 1px solid var(--surface-subtle);
        }

        .rating-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: #fff9ee;
            color: var(--accent-gold);
            border: 1px solid #fae8c8;
            padding: 0.35rem 0.75rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.88rem;
        }

        .review-count {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Sayfalama */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.25rem;
            margin-top: 4rem;
        }

        .btn-page {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--surface);
            color: var(--text-main);
            border: 1.5px solid var(--border);
            padding: 0.75rem 1.6rem;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-soft);
            font-family: inherit;
        }

            .btn-page:hover:not(:disabled) {
                background: var(--primary);
                color: #ffffff;
                border-color: var(--primary);
                transform: translateY(-2px);
                box-shadow: 0 8px 20px rgba(139, 94, 60, 0.25);
            }

            .btn-page:disabled {
                opacity: 0.4;
                cursor: not-allowed;
                border-color: var(--border);
            }

        .page-badge {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* Detay Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(36, 33, 29, 0.5);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-content {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            max-width: 540px;
            width: 100%;
            padding: 2.25rem;
            position: relative;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.15);
        }

        .close-modal {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.6rem;
            cursor: pointer;
        }

            .close-modal:hover {
                color: var(--text-main);
            }

        .modal-reviews-list {
            max-height: 240px;
            overflow-y: auto;
            margin-top: 1.25rem;
            padding-right: 0.5rem;
        }

        .review-card {
            background: var(--bg-canvas);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.85rem 1.1rem;
            margin-bottom: 0.85rem;
            border-left: 3.5px solid var(--primary);
        }

        .review-card-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 5rem 1rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Hero & Header -->
        <header>
            <div class="badge-pill">
                <span>✦ Dijital Kütüphane & Okur Topluluğu</span>
            </div>
            <h1>Kitap Keşif Alanı</h1>
            <p class="subtitle">Binlerce eser, gerçek okur değerlendirmeleri ve puanlarıyla bir sonraki favori kitabını keşfet.</p>

            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-value" id="statTotalBooks">0</div>
                    <div class="stat-label">Toplam Kitap</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statCurrentPage">1</div>
                    <div class="stat-label">Aktif Sayfa</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statTotalPages">1</div>
                    <div class="stat-label">Toplam Sayfa</div>
                </div>
            </div>
        </header>

        <!-- Arama Alanı -->
        <div class="search-wrapper">
            <div class="search-box">
                <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Kitap başlığı veya yazar adına göre ara..." oninput="handleSearch()">
            </div>
        </div>

        <!-- Kitap Grid -->
        <div class="grid" id="booksGrid">
            <!-- Kitap kartları JS ile yüklenecek -->
        </div>

        <!-- Sayfalama -->
        <div class="pagination-container">
            <button id="prevBtn" class="btn-page" onclick="changePage(-1)" disabled>
                ← Önceki
            </button>
            <span id="pageInfo" class="page-badge">Sayfa 1 / 1</span>
            <button id="nextBtn" class="btn-page" onclick="changePage(1)">
                Sonraki →
            </button>
        </div>
    </div>

    <!-- Detay Modal -->
    <div id="bookModal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="closeModal()">&times;</button>
            <h2 id="modalTitle" style="font-family: 'Playfair Display', serif; font-size: 1.5rem; margin-bottom: 0.35rem; color: var(--text-main);">Kitap Başlığı</h2>
            <p id="modalAuthor" style="color: var(--text-muted); margin-bottom: 1.25rem;">Yazar Adı</p>
            <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
                <span id="modalRating" class="rating-badge">★ 0.0</span>
                <span id="modalReviewCount" class="review-count">💬 0 İnceleme</span>
            </div>
            <h4 style="font-size: 0.95rem; color: var(--text-main); margin-bottom: 0.6rem; font-weight: 600;">Son Değerlendirmeler</h4>
            <div id="modalReviewsList" class="modal-reviews-list">
                <!-- Yorumlar yüklenecek -->
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        const pageSize = 9;
        let searchTimeout = null;

        async function fetchBooks() {
            const search = document.getElementById('searchInput').value;
            const url = `/api/Books?page=${currentPage}&pageSize=${pageSize}&search=${encodeURIComponent(search)}`;

            try {
                const res = await fetch(url);
                const result = await res.json();

                // Hem büyük hem küçük harf uyumluluğu:
                const books = result.data || result.Data || [];
                const totalBooks = result.totalBooks ?? result.TotalBooks ?? 0;
                const page = result.currentPage ?? result.CurrentPage ?? currentPage;
                const totalPages = result.totalPages ?? result.TotalPages ?? 1;

                renderBooks(books);
                updateStats(totalBooks, page, totalPages);
            } catch (err) {
                console.error("API Hatası:", err);
            }
        }

        function renderBooks(books) {
            const grid = document.getElementById('booksGrid');
            if (!books || books.length === 0) {
                grid.innerHTML = `
                        <div class="empty-state">
                            <div style="font-size: 2.5rem; margin-bottom: 1rem;">📖</div>
                            <h3 style="font-family: 'Playfair Display', serif; color: var(--text-main);">Aradığınız kriterde eser bulunamadı</h3>
                            <p style="margin-top: 0.5rem;">Farklı bir yazar veya kitap ismi deneyebilirsiniz.</p>
                        </div>`;
                return;
            }

            grid.innerHTML = books.map(b => `
                    <div class="card" onclick="openBookModal(${b.bookId})">
                        <div class="card-header">
                            <span class="book-id-tag">#Eser ${b.bookId}</span>
                            <div class="title">${escapeHtml(b.title)}</div>
                            <div class="author">
                                <span>✍️</span> ${escapeHtml(b.author)}
                            </div>
                        </div>
                        <div class="card-footer">
                            <span class="rating-badge">
                                ★ ${b.averageRating > 0 ? b.averageRating : '0.0'}
                            </span>
                            <span class="review-count">
                                💬 ${b.reviewCount} inceleme
                            </span>
                        </div>
                    </div>
                `).join('');
        }

        function updateStats(totalBooks, page, totalPages) {
            document.getElementById('statTotalBooks').innerText = totalBooks;
            document.getElementById('statCurrentPage').innerText = page;
            document.getElementById('statTotalPages').innerText = totalPages;

            document.getElementById('pageInfo').innerText = `Sayfa ${page} / ${totalPages}`;
            document.getElementById('prevBtn').disabled = (page <= 1);
            document.getElementById('nextBtn').disabled = (page >= totalPages);
        }

        function changePage(delta) {
            currentPage += delta;
            fetchBooks();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                currentPage = 1;
                fetchBooks();
            }, 300);
        }

        async function openBookModal(id) {
            try {
                const res = await fetch(`/api/Books/${id}`);
                if (!res.ok) return;
                const book = await res.json();

                document.getElementById('modalTitle').innerText = book.title;
                document.getElementById('modalAuthor').innerText = `Yazar: ${book.author}`;
                document.getElementById('modalRating').innerText = `★ ${book.averageRating > 0 ? book.averageRating : '0.0'}`;
                document.getElementById('modalReviewCount').innerText = `💬 ${book.reviewCount} İnceleme`;

                const reviewsList = document.getElementById('modalReviewsList');
                if (book.reviews && book.reviews.length > 0) {
                    reviewsList.innerHTML = book.reviews.map(r => `
                            <div class="review-card">
                                <div class="review-card-header">
                                    <strong style="color: var(--text-main);">${escapeHtml(r.reviewerName)}</strong>
                                    <span style="color: var(--accent-gold); font-weight: 600;">★ ${r.rating}/10</span>
                                </div>
                                <p style="color: var(--text-muted); font-size: 0.9rem;">${r.comment ? escapeHtml(r.comment) : '<em>Yorum bırakılmadı.</em>'}</p>
                            </div>
                        `).join('');
                } else {
                    reviewsList.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">Bu kitap için henüz inceleme yazılmamış.</p>';
                }

                document.getElementById('bookModal').style.display = 'flex';
            } catch (err) {
                console.error("Detay yüklenemedi:", err);
            }
        }

        function closeModal() {
            document.getElementById('bookModal').style.display = 'none';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        fetchBooks();
    </script>
</body>
</html>
